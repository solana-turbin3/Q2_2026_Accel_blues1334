[workspace]
members = [
    "programs/*"
]
exclude = [
    "vendor/mpl-core",
]
resolver = "2"

# Local fork of mpl-core 0.12.0 that adds `#[inline(never)]` + a heap-boxed accumulator to
# `registry_records_to_plugin_list`, removing the three "Stack offset exceeded 4096" SBF
# warnings emitted while compiling the upstream crate. See vendor/mpl-core/src/hooked/plugin.rs.
[patch.crates-io]
mpl-core = { path = "vendor/mpl-core" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
