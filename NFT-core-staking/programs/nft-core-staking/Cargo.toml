[package]
name = "nft-core-staking"
version = "0.1.0"
description = "Metaplex Core NFT staking program with separate claim_rewards and collection-level stats (Anchor 1.0.2)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nft_core_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
# Metaplex Core. Default features ("borsh-v1") only — do NOT enable the "anchor"
# feature: it pulls anchor-lang 0.31.1 which conflicts with anchor-lang 1.0.2.
# We provide our own thin Anchor wrappers for Core accounts instead
# (see state/core_accounts.rs).
mpl-core = "0.12.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3"
solana-pubkey = "3"
solana-account = "3"
solana-clock = "3"
# Used host-side (test target) to decode the collection's Attributes plugin.
mpl-core = "0.12.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
