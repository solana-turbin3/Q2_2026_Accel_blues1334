[package]
name = "persistent-todo-queue"
version = "0.1.0"
edition = "2021"
description = "Persistent FIFO todo queue CLI backed by Borsh serialization."

[workspace]

[lib]
name = "persistent_todo_queue"
path = "src/lib.rs"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
